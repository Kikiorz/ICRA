[program:icra-inference]
directory=/workspace/ICRA
command=/bin/bash /workspace/ICRA/scripts/run_cup_experiment.sh
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
environment=PROC_NAME="%(program_name)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
