[program:icra-hamster-inference]
directory=/workspace/ICRA
command=/workspace/ICRA/.venv-hamster/bin/python -m hamster.run_inference --output-dir outputs/hamster_cup_lift_fp16
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
environment=PROC_NAME="%(program_name)s",PYTHONUNBUFFERED="1",PYTHONPATH="/workspace/ICRA/external/VILA"
stdout_logfile=/workspace/ICRA/outputs/hamster_inference.log
stdout_logfile_maxbytes=10000000
redirect_stderr=true
