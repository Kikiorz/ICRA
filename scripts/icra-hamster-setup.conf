[program:icra-hamster-setup]
directory=/workspace/ICRA
command=/bin/bash /workspace/ICRA/scripts/setup_hamster.sh
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
environment=PROC_NAME="%(program_name)s",PYTHONUNBUFFERED="1"
stdout_logfile=/workspace/ICRA/outputs/hamster_setup.log
stdout_logfile_maxbytes=10000000
redirect_stderr=true
