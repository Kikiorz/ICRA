[program:icra-inference-no-thinking]
directory=/workspace/ICRA
command=/usr/bin/env ICRA_RUN_DIR=outputs/cup_lift_bf16_no_thinking /bin/bash /workspace/ICRA/scripts/run_cup_experiment.sh --no-thinking
autostart=false
autorestart=false
startsecs=0
stopasgroup=true
killasgroup=true
environment=PROC_NAME="%(program_name)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
