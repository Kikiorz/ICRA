; Install after adjusting directory to your checkout. Accessible only via SSH forwarding.
[program:icra-viewer]
directory=/workspace/ICRA
command=/bin/bash /workspace/ICRA/scripts/serve_results.sh
autostart=true
autorestart=unexpected
environment=PROC_NAME="%(program_name)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
